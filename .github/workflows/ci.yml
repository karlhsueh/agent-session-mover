name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # GitHub's release CDN sometimes times out on the Electron download, so keep it between runs.
      - uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/electron
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      # Ubuntu 24.04 blocks the unprivileged user namespaces that Chromium's sandbox needs.
      - name: Allow the Electron sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Smoke
        if: runner.os != 'Linux'
        run: pnpm smoke

      - name: Smoke
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm smoke

      - name: Upload smoke screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-artifacts-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: ignore
