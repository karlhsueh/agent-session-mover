name: Homebrew tap

on:
  # A draft you publish yourself. The release workflow calls this one when it publishes.
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to write into the cask, such as v0.1.1
        required: true

permissions:
  contents: read

concurrency:
  group: homebrew-tap
  cancel-in-progress: false

jobs:
  update:
    name: Update the cask
    if: github.repository == 'karlhsueh/agent-session-mover' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      # The release app is installed on the tap. Its token reaches only that repository and expires after an hour.
      - name: Get a token for the tap
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: homebrew-tap
          permission-contents: write

      - name: Download SHA256SUMS
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir "$RUNNER_TEMP/sums"

      - name: Clone the tap
        env:
          TAP_TOKEN: ${{ steps.app.outputs.token }}
        run: git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/karlhsueh/homebrew-tap.git" "$RUNNER_TEMP/tap"

      - name: Write the cask
        run: scripts/update-cask.sh "$TAG" "$RUNNER_TEMP/sums/SHA256SUMS" "$RUNNER_TEMP/tap/Casks/agent-session-mover.rb"

      - name: Push
        working-directory: ${{ runner.temp }}/tap
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BOT: ${{ steps.app.outputs.app-slug }}[bot]
        run: |
          if git diff --quiet; then
            echo "The cask already matches $TAG."
            git push --dry-run origin HEAD
            exit 0
          fi
          git config user.name "$BOT"
          git config user.email "$(gh api "users/$BOT" --jq .id)+$BOT@users.noreply.github.com"
          git commit -am "feat(cask): agent-session-mover ${TAG#v}"
          git push origin HEAD
