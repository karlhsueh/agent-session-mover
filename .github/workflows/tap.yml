name: Homebrew tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to write into the cask, such as v0.1.1
        required: true

permissions:
  contents: read

concurrency:
  group: homebrew-tap
  cancel-in-progress: false

jobs:
  update:
    name: Update the cask
    if: github.repository == 'karlhsueh/agent-sessions' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the token
        run: |
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "::error::Set the HOMEBREW_TAP_TOKEN secret. See docs/RELEASING.md."
            exit 1
          fi

      - name: Download SHA256SUMS
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir "$RUNNER_TEMP/sums"

      - name: Clone the tap
        run: git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/karlhsueh/homebrew-tap.git" "$RUNNER_TEMP/tap"

      - name: Write the cask
        run: scripts/update-cask.sh "$TAG" "$RUNNER_TEMP/sums/SHA256SUMS" "$RUNNER_TEMP/tap/Casks/agent-sessions.rb"

      - name: Push
        working-directory: ${{ runner.temp }}/tap
        run: |
          if git diff --quiet; then
            echo "The cask already matches $TAG."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "feat(cask): agent-sessions ${TAG#v}"
          git push origin HEAD
