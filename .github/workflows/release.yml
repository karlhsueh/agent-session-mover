name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        required: true
        type: choice
        default: patch
        options: [patch, minor, major]
      draft:
        description: Stop at a draft release instead of publishing
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  cut:
    name: Bump the version and tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Release only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the release from main, not $GITHUB_REF_NAME."
          exit 1

      # The main ruleset lets this app push the version commit. The workflow token cannot be exempted on a personal repo.
      - name: Get a token for the release app
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token }}

      - name: Require green CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state="$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --event push --limit 1 --json status,conclusion --jq '.[0] | "\(.status)/\(.conclusion)"')"
          if [[ "$state" != "completed/success" ]]; then
            echo "::error::CI on $GITHUB_SHA is ${state:-missing}. Release a commit whose CI passed."
            exit 1
          fi

      - name: Bump, commit, and tag
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BOT: ${{ steps.app.outputs.app-slug }}[bot]
        run: |
          set -euo pipefail
          tag="$(npm version "$BUMP" --no-git-tag-version)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::error::Tag $tag already exists."
            exit 1
          fi
          git config user.name "$BOT"
          git config user.email "$(gh api "users/$BOT" --jq .id)+$BOT@users.noreply.github.com"
          git commit -am "chore(release): ${tag#v}"
          git tag "$tag"
          # Atomic, so a main that moved since the run started gets neither the commit nor the tag.
          git push --atomic origin HEAD:main "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: cut
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.cut.outputs.tag }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # GitHub's release CDN sometimes times out on the Electron download, so keep it between runs.
      - uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/electron
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Package for macOS
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          present=0
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -n "${!name}" ]]; then present=$((present + 1)); fi
          done
          if [[ "$present" -eq 5 ]]; then
            echo "Signing with the Developer ID certificate in CSC_LINK and notarizing with the App Store Connect API key."
            key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            (umask 077 && printf '%s\n' "$APPLE_API_KEY" > "$key_path")
            export APPLE_API_KEY="$key_path"
            pnpm exec electron-builder --mac --publish never
            # One app per chip. Each must be notarized on its own.
            apps="$(find dist -maxdepth 2 -name 'Agent Sessions.app')"
            [[ "$(wc -l <<<"$apps")" -eq 2 ]] || { echo "::error::Expected an arm64 and an x64 app, found: $apps"; exit 1; }
            while IFS= read -r app; do
              spctl -a -vv "$app" 2>&1 | tee "$RUNNER_TEMP/spctl.txt"
              grep -q 'source=Notarized Developer ID' "$RUNNER_TEMP/spctl.txt"
            done <<<"$apps"
          elif [[ "$present" -eq 0 ]]; then
            # Installed apps refuse an update signed by anyone else, so an unsigned build must not be published.
            if [[ "$DRAFT" != "true" ]]; then
              echo "::error::No signing secrets are set. Run the release with draft checked, or add the secrets in docs/RELEASING.md."
              exit 1
            fi
            echo "::warning title=Unsigned macOS build::No signing secrets are set, so the macOS app is ad-hoc signed and not notarized. Gatekeeper will block it on first open. See docs/RELEASING.md to add the secrets."
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
            pnpm exec electron-builder --mac --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false
          else
            echo "::error::Only $present of the 5 macOS signing secrets are set. Set all of CSC_LINK, CSC_KEY_PASSWORD, APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER, or none."
            exit 1
          fi

      - name: Package for Windows
        if: matrix.platform == 'win'
        run: pnpm exec electron-builder --win --publish never

      - name: Package for Linux
        if: matrix.platform == 'linux'
        run: pnpm exec electron-builder --linux --publish never

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml

  release:
    name: Publish the GitHub release
    needs: [cut, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.cut.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Full history, so the notes can list the commits since the previous tag.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.cut.outputs.tag }}
          fetch-depth: 0

      - name: Draft the release notes
        run: |
          scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: release

      - name: Check every file is there
        working-directory: release
        run: |
          set -euo pipefail
          for file in \
            agent-sessions-mac-arm64.dmg agent-sessions-mac-arm64.dmg.blockmap \
            agent-sessions-mac-arm64.zip agent-sessions-mac-arm64.zip.blockmap \
            agent-sessions-mac-x64.dmg agent-sessions-mac-x64.dmg.blockmap \
            agent-sessions-mac-x64.zip agent-sessions-mac-x64.zip.blockmap \
            agent-sessions-win-x64.exe agent-sessions-win-x64.exe.blockmap \
            agent-sessions-linux-x86_64.AppImage agent-sessions-linux-amd64.deb \
            latest-mac.yml latest.yml latest-linux.yml; do
            [[ -s "$file" ]] || { echo "::error::$file is missing."; exit 1; }
          done
          for file in latest*.yml; do
            grep -qx "version: ${TAG#v}" "$file" || { echo "::error::$file is not for ${TAG#v}."; exit 1; }
          done

      - name: Write SHA256SUMS
        working-directory: release
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      # The release stays a draft while files upload, so an installed app never sees half a release.
      - name: Upload to a draft release
        working-directory: release
        run: |
          set -euo pipefail
          if is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$is_draft" != "true" ]]; then
              echo "::error::Release $TAG is already published. Not replacing its files."
              exit 1
            fi
            gh release upload "$TAG" --clobber -- *
          else
            gh release create "$TAG" --draft --verify-tag --notes-file "$RUNNER_TEMP/notes.md" --title "Agent Sessions ${TAG#v}" -- *
          fi

      - name: Publish
        if: inputs.draft != true
        run: gh release edit "$TAG" --draft=false --latest

  # A release published with the workflow token starts no other workflow, so the tap update runs from here.
  tap:
    name: Update the Homebrew tap
    needs: [cut, release]
    if: inputs.draft != true
    permissions:
      contents: read
    uses: ./.github/workflows/tap.yml
    with:
      tag: ${{ needs.cut.outputs.tag }}
    secrets: inherit
